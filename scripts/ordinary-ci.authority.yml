name: TypeScript alpha

on:
  push:
    branches: [release]
  pull_request:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Static checks and runtime packaging run once per OS while the Vitest suite
  # runs in parallel shards below.
  check-static:
    if: github.ref == 'refs/heads/release' || github.base_ref == 'release'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Fetch the PR target and its ancestry for the health history ratchet.
          fetch-depth: 0
      - name: Verify fetched health baseline
        shell: bash
        env:
          HEALTH_PR_BASE: ${{ github.base_ref || 'dev' }}
        run: git rev-parse --verify "refs/remotes/origin/$HEALTH_PR_BASE^{commit}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run check:static
        env:
          THERMITE_RESEARCH_PYTHON: python
      - run: bun run package:pack
      - name: Verify Linux candidate without network access
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker pull oven/bun:1.4.2
          for archive in release-out/runtime/*/*.zip; do
            docker run --rm --network=none --user "$(id -u):$(id -g)" \
              --volume "$PWD:/work:ro" --volume "$PWD/release-out:/evidence" \
              --workdir /work oven/bun:1.4.2 bun -e '
                import { verifyRuntimeArchive } from "./scripts/runtime-package/verify.mjs";
                import { writeFileSync } from "node:fs";
                const report = await verifyRuntimeArchive(process.argv[1]);
                if (report.networkIsolation !== "loopback-only-network-namespace")
                  throw new Error("Linux acceptance requires network isolation");
                writeFileSync(process.argv[2], JSON.stringify(report, null, 2) + "\n");
              ' "/work/$archive" "/evidence/${archive#release-out/}.network-verification.json"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runtime-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: |
            release-out/runtime/**/*.zip
            release-out/runtime/**/*.zip.sha256
            release-out/runtime/**/*.zip.json
            release-out/runtime/**/verification.json
            release-out/runtime/**/*.network-verification.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  # Vitest shards partition the complete test file set deterministically via
  # CiSequencer.shard so every test runs on every OS with headroom to spare.
  check-test:
    if: github.ref == 'refs/heads/release' || github.base_ref == 'release'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2022]
        shard: [1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      THERMITE_CI_MAX_WORKERS: ${{ matrix.os == 'ubuntu-24.04' && '2' || '3' }}
      THERMITE_REQUIRE_BROWSER: "1"
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/../thermite-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Fetch the PR target and its ancestry for health and contract tests.
          fetch-depth: 0
      - name: Verify fetched health baseline
        shell: bash
        env:
          HEALTH_PR_BASE: ${{ github.base_ref || 'dev' }}
        run: git rev-parse --verify "refs/remotes/origin/$HEALTH_PR_BASE^{commit}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Cache pinned Chromium
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - name: Install pinned Chromium and system dependencies
        timeout-minutes: 20
        run: bun scripts/install-ci-browser.mjs
      - name: Select pinned Chromium for both browser harnesses
        shell: bash
        run: |
          bun -e '
            import { chromium } from "playwright-core";
            import { accessSync, appendFileSync } from "node:fs";
            const executable = chromium.executablePath();
            accessSync(executable);
            appendFileSync(process.env.GITHUB_ENV,
              "THERMITE_DRAW_CHROMIUM=" + executable + "\n" +
              "THERMITE_TEST_BROWSER=" + executable + "\n");
          '
      - name: Run test shard
        run: bun run test -- --shard=${{ matrix.shard }}/2
        env:
          THERMITE_RESEARCH_PYTHON: python
          THERMITE_TEST_TIMINGS_FILE: ${{ runner.temp }}/thermite-test-timings.json
      - name: Upload check durations
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-durations-check-${{ runner.os }}-${{ runner.arch }}-shard-${{ matrix.shard }}-of-2-${{ github.run_attempt }}
          path: ${{ runner.temp }}/thermite-test-timings.json
          if-no-files-found: ignore
          retention-days: 7

  # The linked-worktree check repeats static checks (on shard 1) and the full
  # sharded test suite from a linked worktree in parallel with the clone check.
  worktree:
    if: github.ref == 'refs/heads/release' || github.base_ref == 'release'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2022]
        shard: [1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      THERMITE_CI_MAX_WORKERS: ${{ matrix.os == 'ubuntu-24.04' && '2' || '3' }}
      THERMITE_REQUIRE_BROWSER: "1"
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/../thermite-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Fetch the PR target and its ancestry for the health history ratchet.
          fetch-depth: 0
      - name: Verify fetched health baseline
        shell: bash
        env:
          HEALTH_PR_BASE: ${{ github.base_ref || 'dev' }}
        run: git rev-parse --verify "refs/remotes/origin/$HEALTH_PR_BASE^{commit}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Cache pinned Chromium
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - name: Install pinned Chromium and system dependencies
        timeout-minutes: 20
        run: bun scripts/install-ci-browser.mjs
      - name: Select pinned Chromium for both browser harnesses
        shell: bash
        run: |
          bun -e '
            import { chromium } from "playwright-core";
            import { accessSync, appendFileSync } from "node:fs";
            const executable = chromium.executablePath();
            accessSync(executable);
            appendFileSync(process.env.GITHUB_ENV,
              "THERMITE_DRAW_CHROMIUM=" + executable + "\n" +
              "THERMITE_TEST_BROWSER=" + executable + "\n");
          '
      - name: Check a linked worktree
        run: bun scripts/check-worktree.mjs --shard=${{ matrix.shard }}/2
        env:
          THERMITE_RESEARCH_PYTHON: python
          THERMITE_TEST_TIMINGS_FILE: ${{ runner.temp }}/thermite-test-timings.json
      - name: Upload worktree durations
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-durations-worktree-${{ runner.os }}-${{ runner.arch }}-shard-${{ matrix.shard }}-of-2-${{ github.run_attempt }}
          path: ${{ runner.temp }}/thermite-test-timings.json
          if-no-files-found: ignore
          retention-days: 7

  # 20-pair contract conflict barrier per OS; uploads winner/loser/sentinel receipts.
  contract-receipts:
    if: github.ref == 'refs/heads/release' || github.base_ref == 'release'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Run 20-pair contract conflict barrier
        timeout-minutes: 4
        run: bun scripts/contract-receipts.mjs --conflicts 20 --output "${{ runner.temp }}/contract-receipts"
      - name: Upload contract conflict receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: contract-receipts-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/contract-receipts/contract-receipt.json
          if-no-files-found: error
          retention-days: 14

  # Stable aggregate status check for branch protection across all OSes/shards.
  # Matches the release-only trigger predicate of the upstream jobs (including
  # workflow_dispatch on release); queries the Jobs API so matrix legs
  # cancelled before runner assignment cannot pass silently.
  ci-result:
    if: always() && (github.ref == 'refs/heads/release' || github.base_ref == 'release')
    needs: [check-static, check-test, worktree, contract-receipts]
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify every expected static, test, worktree, and contract job succeeded
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          CHECK_STATIC_RESULT: ${{ needs.check-static.result }}
          CHECK_TEST_RESULT: ${{ needs.check-test.result }}
          WORKTREE_RESULT: ${{ needs.worktree.result }}
          CONTRACT_RECEIPTS_RESULT: ${{ needs.contract-receipts.result }}
        run: node scripts/verify-ci-result.mjs
